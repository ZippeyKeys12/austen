[package]
name = "austen-radamsa"
description = "Radamsa 0.7 byte-mutation generator adapter for Austen over a persistent loopback TCP session"
edition = { workspace = true }
version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
exclude = { workspace = true }
autotests = false
autobenches = false
autoexamples = false

[features]
vendored = ["dep:cc", "dep:sha2"]

[dependencies]
austen-lib = { workspace = true, features = ["driver"] }
thiserror = { workspace = true }
libc = { workspace = true }

[build-dependencies]
cc = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
